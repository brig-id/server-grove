name: CI

on:
  push:
    branches: [main, "dev/*"]
  pull_request:
    branches: [main, "dev/*"]

permissions:
  contents: read

# fmt, clippy, tests and the audits, as for every Rust repository of the org.
# The release jobs (static binaries, the image on ghcr.io) come with the
# first release of grove, on the model of server-seedling's.
jobs:
  ci:
    uses: brig-id/.github/.github/workflows/ci-rust.yml@5e019131d735e4ed0bd3598b5a61137bdae7eff3
    with:
      working-directory: .

  security:
    uses: brig-id/.github/.github/workflows/security-audit.yml@5e019131d735e4ed0bd3598b5a61137bdae7eff3
    with:
      working-directory: .
