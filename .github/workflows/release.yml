name: Release

# release-please keeps one pull request up to date with the next version and
# its changelog entry, from the commits merged to main. Merging that pull
# request is the release: release-please creates the tag `vX.Y.Z` and the
# GitHub Release, and the shared workflow then starts CI on that tag, whose
# tag-only jobs add the binaries and push the image. Nobody tags by hand.
#
# A new release of the core, crypto or the interface comes from Renovate as
# feat(deps) or fix(deps): merging it is what makes the next release here.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: brig-id/.github/.github/workflows/release.yml@b5d01e58e844ef8c4fa8f1799ad56a2dbe9651a7
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      workflows: ci.yml
