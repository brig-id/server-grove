[package]
name = "grove"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.89"

[dependencies]
# The server every edition runs (core): grove only describes itself.
brigid-server = { git = "https://github.com/brig-id/core", rev = "8558f70fd91668b54246c24b54b8d53206ff0ee7", package = "brigid-server" }

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }

# A static (musl) build carries its own OpenSSL: the system's is not there to
# link to. OpenSSL is reached only by the attestation code of webauthn-rs,
# which brig·id never runs (attestation "none").
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
brigid-ui-embed = { git = "https://github.com/brig-id/core", rev = "8558f70fd91668b54246c24b54b8d53206ff0ee7", package = "brigid-ui-embed" }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "abort"
