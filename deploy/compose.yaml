# brig·id grove — the server for a community, with its database replicated.
#
#   cp deploy/grove.env.example deploy/grove.env    # then edit it
#   mkdir -p deploy/secrets && umask 077
#   openssl rand -hex 32     > deploy/secrets/master_key      # keep a copy offline
#   openssl rand -base64 32  > deploy/secrets/replica_sse_key # idem
#   printf %s "<access key id>"     > deploy/secrets/replica_key_id
#   printf %s "<secret access key>" > deploy/secrets/replica_secret
#   docker compose -f deploy/compose.yaml --env-file deploy/grove.env up -d
#
# Two services on one volume:
# - grove: the server, plain HTTP on 8080 behind your reverse proxy (it holds
#   the certificate and must *replace* X-Forwarded-For); metrics on 9100,
#   never published.
# - litestream: copies every change of the database to an S3-compatible
#   bucket within a minute, a week of history (litestream.yml).
#
# Image: a release, pinned by digest in GROVE_IMAGE
# (ghcr.io/brig-id/grove:vX.Y.Z@sha256:…), or one built from this repository
# (`docker build -t brigid/grove:dev .`).

secrets:
  brigid_master_key:
    file: ./secrets/master_key
  replica_key_id:
    file: ./secrets/replica_key_id
  replica_secret:
    file: ./secrets/replica_secret
  replica_sse_key:
    file: ./secrets/replica_sse_key

volumes:
  grove-data:

services:
  grove:
    image: ${GROVE_IMAGE:-brigid/grove:dev}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - grove-data:/data
    secrets:
      - brigid_master_key
    environment:
      RUST_LOG: "brigid_api=info,brigid_server=info,warn"
      BRIGID_MASTER_KEY_FILE: /run/secrets/brigid_master_key
      BRIGID_SERVER__DOMAIN: "${BRIGID_DOMAIN:?BRIGID_DOMAIN must be set}"
      BRIGID_SERVER__PUBLIC_URL: "https://${BRIGID_DOMAIN}"
      BRIGID_SERVER__HOST: "0.0.0.0"
      BRIGID_SERVER__PORT: "8080"
      BRIGID_SERVER__METRICS_PORT: "9100"
      BRIGID_DATABASE__PATH: "/data/brigid.db"
      BRIGID_SECURITY__CORS_ORIGINS: '["https://${BRIGID_DOMAIN}"]'
      BRIGID_SECURITY__TRUST_FORWARDED_FOR: "true"
    ports:
      # Your reverse proxy forwards to it; bound to this machine only.
      - "127.0.0.1:${GROVE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/grove", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  litestream:
    # litestream/litestream:0.5.18, multi-arch index digest (amd64 + arm64).
    image: litestream/litestream:0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
    restart: unless-stopped
    # The server's user: files SQLite creates beside the database stay its own.
    user: "65532:65532"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        LITESTREAM_ACCESS_KEY_ID="$$(cat /run/secrets/replica_key_id)"
        LITESTREAM_SECRET_ACCESS_KEY="$$(cat /run/secrets/replica_secret)"
        exec litestream replicate -config /etc/litestream.yml
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      REPLICA_ENDPOINT: "${REPLICA_ENDPOINT:?REPLICA_ENDPOINT must be set}"
      REPLICA_BUCKET: "${REPLICA_BUCKET:?REPLICA_BUCKET must be set}"
    volumes:
      - grove-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    secrets:
      - source: replica_key_id
        uid: "65532"
        mode: 0400
      - source: replica_secret
        uid: "65532"
        mode: 0400
      - source: replica_sse_key
        uid: "65532"
        mode: 0400
    depends_on:
      - grove
